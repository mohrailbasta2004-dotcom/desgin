<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحلم محتاج قرار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a1450}
body{display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-family:'Cairo',Tahoma,sans-serif}
.post{width:min(100vw,100vh,720px);aspect-ratio:1/1;position:relative;overflow:hidden}
svg{position:absolute;inset:0;width:100%;height:100%}
.rocket{animation:fly 3s ease-in-out infinite}
@keyframes fly{50%{transform:translateY(-18px)}}
.flame{animation:flick .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}
@keyframes flick{to{transform:scaleY(1.25) scaleX(.9)}}
.cloud{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(25px)}}
.tw{animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
</style>
</head>
<body>
<div class="post">
<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" font-family="Cairo,Tahoma,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1b7a"/><stop offset=".55" stop-color="#c2467f"/><stop offset="1" stop-color="#ff9a5a"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9c0d6"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".7" stop-color="#e3e7f3"/><stop offset="1" stop-color="#8e97b5"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a81c3c"/><stop offset=".35" stop-color="#ff5b7a"/><stop offset="1" stop-color="#8a1230"/></linearGradient>
<linearGradient id="fin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d12f55"/><stop offset="1" stop-color="#7d1030"/></linearGradient>
<radialGradient id="win" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#bff0ff"/><stop offset=".5" stop-color="#3aa0e6"/><stop offset="1" stop-color="#0f3f8a"/></radialGradient>
<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6a8"/><stop offset=".5" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff4a1c" stop-opacity="0"/></linearGradient>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<g fill="#fff"><circle class="tw" cx="90" cy="300" r="3"/><circle class="tw" cx="700" cy="260" r="4" style="animation-delay:.6s"/><circle class="tw" cx="640" cy="420" r="3" style="animation-delay:1.1s"/><circle class="tw" cx="140" cy="450" r="4" style="animation-delay:.3s"/><circle class="tw" cx="730" cy="520" r="3" style="animation-delay:1.5s"/></g>

<text x="400" y="105" text-anchor="middle" font-size="62" font-weight="900" fill="#fff">حلمك مش بعيد</text>
<text x="400" y="175" text-anchor="middle" font-size="50" font-weight="900" fill="#ffe27a">هو مستني قرارك 🚀</text>

<g class="cloud" fill="#fff" opacity=".85"><circle cx="150" cy="620" r="55"/><circle cx="215" cy="640" r="45"/><circle cx="95" cy="645" r="38"/></g>
<g class="cloud" fill="#fff" opacity=".85" style="animation-delay:-3s"><circle cx="640" cy="610" r="50"/><circle cx="700" cy="635" r="40"/><circle cx="585" cy="640" r="36"/></g>

<g class="rocket">
 <g class="flame"><path d="M350 535 Q400 760 450 535 Z" fill="url(#fl)"/></g>
 <path d="M338 450 L255 565 L338 525 Z" fill="url(#fin)"/>
 <path d="M462 450 L545 565 L462 525 Z" fill="url(#fin)"/>
 <path d="M400 215 C480 290 490 420 475 535 L325 535 C310 420 320 290 400 215 Z" fill="url(#body)"/>
 <path d="M400 215 C440 255 458 295 462 335 L338 335 C342 295 360 255 400 215 Z" fill="url(#red)"/>
 <rect x="325" y="515" width="150" height="22" rx="8" fill="#6c7494"/>
 <circle cx="400" cy="425" r="46" fill="#7a82a3"/>
 <circle cx="400" cy="425" r="37" fill="url(#win)"/>
 <ellipse cx="388" cy="412" rx="12" ry="7" fill="#fff" opacity=".6"/>
</g>

<text x="400" y="715" text-anchor="middle" font-size="34" font-weight="900" fill="#fff">اللي بيبدأ… بيوصل</text>
<text x="400" y="758" text-anchor="middle" font-size="24" font-weight="600" fill="#ffe9c7">اضغط على زرار الانطلاق قبل ما تحس إنك جاهز</text>
</svg>
</div>
</body>
</html>
